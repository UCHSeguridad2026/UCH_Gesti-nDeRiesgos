# entorno/docker-compose.yml

# Uso:
# cd entorno
# docker compose up -d
# Luego abrir http://localhost:8080 ó https://localhost:8443

version: "3.6"

services:
  simplerisk:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - simplerisk_data:/var/www/html

volumes:
  simplerisk_data:
