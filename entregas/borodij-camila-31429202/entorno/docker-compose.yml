services:
  db:
    image: mariadb:10.5
    container_name: simplerisk-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simplerisk
      MYSQL_USER: simplerisk
      MYSQL_PASSWORD: simpleriskpassword
    restart: always

  simplerisk:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk-app
    ports:
      - "9000:80"
      - "9443:443"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: simplerisk
      DB_PASSWORD: simpleriskpassword
      DB_DATABASE: simplerisk
    depends_on:
      - db
    restart: always
