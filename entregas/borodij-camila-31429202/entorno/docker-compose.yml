version: '3.8'

services:
  simplerisk-db:
    image: mariadb:10.5
    container_name: simplerisk-db
    environment:
      MYSQL_ROOT_PASSWORD: root_demo_password
      MYSQL_DATABASE: simplerisk
      MYSQL_USER: simplerisk
      MYSQL_PASSWORD: simplerisk_demo_password
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  simplerisk-app:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: simplerisk-db
      DB_PORT: 3306
      DB_USERNAME: simplerisk
      DB_PASSWORD: simplerisk_demo_password
      DB_DATABASE: simplerisk
    depends_on:
      - simplerisk-db
    restart: always

volumes:
  db_data:
