services:
  simplerisk:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk
    restart: unless-stopped
    ports:
      # Host:Contenedor. Se mapean a 8080/8443 en el host para evitar
      # choques con IIS, Skype u otros servicios que en Windows suelen
      # tomar los puertos 80/443.
      - "8080:80"
      - "8443:443"