services:

  mysql:
    image: mysql:8.0
    container_name: simplerisk-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: simplerisk
      MYSQL_USER: simplerisk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    command: --sql-mode=

    volumes:
      - mysql-data:/var/lib/mysql

  simplerisk:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    depends_on:
      - mysql

    volumes:
      - simplerisk-config:/var/www/simplerisk/includes
      - simplerisk-logs:/var/www/simplerisk/logs
      - simplerisk-uploads:/var/www/simplerisk/uploads

volumes:
  mysql-data:
  simplerisk-config:
  simplerisk-logs:
  simplerisk-uploads:
