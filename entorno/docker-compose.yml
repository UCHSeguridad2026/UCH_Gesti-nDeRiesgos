version: '3.8'

services:
  simplerisk-db:
    image: mysql:8.0
    container_name: simplerisk-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_ficticia
      MYSQL_DATABASE: simplerisk
      MYSQL_USER: simplerisk_user
      MYSQL_PASSWORD: simplerisk_password_ficticia
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - simplerisk-net

  simplerisk-app:
    image: simplerisk/simplerisk:latest
    container_name: simplerisk-web
    ports:
      - "9000:443"
    environment:
      SIMPLERISK_DB_HOST: simplerisk-mysql
      SIMPLERISK_DB_USER: simplerisk_user
      SIMPLERISK_DB_PASSWORD: simplerisk_password_ficticia
      SIMPLERISK_DB_NAME: simplerisk
    depends_on:
      - simplerisk-db
    networks:
      - simplerisk-net

volumes:
  db_data:

networks:
  simplerisk-net:

 
